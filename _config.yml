# About Section
# about_title: About Me
about_profile_image: images/profile.png
about_content: | # this will include new lines to allow paragraphs

  I work at the intersection of technology, program execution, documentation engineering, and process improvement. I am especially effective when the work is complex: understanding how a system operates, bringing structure to competing priorities, coordinating across teams, improving workflows, and getting important work completed accurately and on schedule.

  Most recently at NVIDIA, I have worked directly in engineering workflows supporting AI retrieval technologies. My work spans release readiness, documentation QA, GitHub-based development, CI/build and publishing automation, information architecture, and developer experience, including more than 200 public pull requests to NVIDIA's NeMo Retriever repository.

  My broader background includes technical program management and developer relations, API product and platform work, release management, documentation governance, and cross-functional collaboration with engineering, product, QA, and business stakeholders. I bring the communication discipline of a senior documentation professional to program and operations work where execution, traceability, quality, and follow-through matter.

  I hold an MBA from Santa Clara University's Leavey School of Business and have completed the Google Project Management Certificate. I am interested in program and operations management, process improvement, technical program management, developer experience, and documentation engineering roles where I can bring structure to complex work and help teams deliver.

  I am currently based in San Jose, CA.

